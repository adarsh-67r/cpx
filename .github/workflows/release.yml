# Push a tag like v0.1.0 (or v0.1.0-beta.1 for a pre-release) to build cpx
# for each platform plus the VS Code extension, attached to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/cpx.exe, README.md, LICENSE -DestinationPath cpx-${{ matrix.target }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf cpx-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cpx -C "$GITHUB_WORKSPACE" README.md LICENSE

      - uses: softprops/action-gh-release@v2
        with:
          files: cpx-${{ matrix.target }}.*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: extensions/vscode/*.vsix
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
