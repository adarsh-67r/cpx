[package]
name = "cpx"
version = "0.1.0"
edition = "2021"
description = "Competitive programming in the terminal: problems, practice, contests, analytics"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
scraper = "0.22"
anyhow = "1"
chrono = "0.4"
dirs = "5"
regex = "1"
ego-tree = "0.10"
